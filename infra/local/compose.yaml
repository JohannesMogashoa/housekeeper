services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: housekeeper
      POSTGRES_USER: housekeeper
      POSTGRES_PASSWORD: housekeeper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housekeeper -d housekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - housekeeper-postgres:/var/lib/postgresql

volumes:
  housekeeper-postgres:
