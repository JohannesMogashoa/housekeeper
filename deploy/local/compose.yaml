name: housekeeper-local

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: housekeeper
      POSTGRES_USER: housekeeper
      POSTGRES_PASSWORD: housekeeper_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housekeeper -d housekeeper"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - housekeeper-postgres:/var/lib/postgresql/data

volumes:
  housekeeper-postgres:
