name: housekeeper-local

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: housekeeper
      POSTGRES_USER: housekeeper
      POSTGRES_PASSWORD: housekeeper_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housekeeper -d housekeeper"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - housekeeper-postgres:/var/lib/postgresql/data

  s3:
    image: minio/minio:RELEASE.2024-06-13T19-44-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: housekeeper_local
      MINIO_ROOT_PASSWORD: housekeeper_local_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - housekeeper-s3:/data

volumes:
  housekeeper-postgres:
  housekeeper-s3:
