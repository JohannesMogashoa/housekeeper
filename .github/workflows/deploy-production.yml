name: Deploy production and publish release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write
  pull-requests: read
  actions: read
  id-token: write

concurrency:
  group: housekeeper-production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve merged release candidate
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      candidate_run_id: ${{ steps.resolve.outputs.candidate_run_id }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Locate exact successful release validation
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_BRANCH}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production deployment only accepts semver release branches; got ${RELEASE_BRANCH}." >&2
            exit 1
          fi
          test -n "${MERGE_SHA}" && test "${MERGE_SHA}" != "null" || {
            echo 'Merged pull request has no merge commit SHA.' >&2
            exit 1
          }
          release_version="${RELEASE_BRANCH#release/}"
          candidate_run_id="$(gh run list \
            --repo "${REPOSITORY}" \
            --workflow ci.yml \
            --branch "${RELEASE_BRANCH}" \
            --limit 100 \
            --json databaseId,headSha,event,status,conclusion | \
            jq -r --arg sha "${SOURCE_SHA}" '[.[] | select((.event == "push" or .event == "workflow_dispatch") and .headSha == $sha and .status == "completed" and .conclusion == "success")] | .[0].databaseId // empty')"
          test -n "${candidate_run_id}" || {
            echo "No successful release-branch validation artifact exists for release head ${SOURCE_SHA}." >&2
            exit 1
          }
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "candidate_run_id=${candidate_run_id}"
            echo "release_version=${release_version}"
            echo "merge_sha=${MERGE_SHA}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy exact candidate to production
    needs: prepare
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      candidate_run_id: ${{ needs.prepare.outputs.candidate_run_id }}
      release_version: ${{ needs.prepare.outputs.release_version }}
    secrets: inherit

  publish:
    name: Create final tag and GitHub Release
    needs:
      - prepare
      - deploy
    if: ${{ needs.prepare.result == 'success' && needs.deploy.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
    steps:
      - name: Create final release tag only after deployment succeeds
        shell: bash
        run: |
          set -euo pipefail
          existing_sha="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "${existing_sha}" ]]; then
            test "${existing_sha}" = "${MERGE_SHA}" || {
              echo "${RELEASE_VERSION} already points at ${existing_sha}, not ${MERGE_SHA}." >&2
              exit 1
            }
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_VERSION}" \
              -f "sha=${MERGE_SHA}"
          fi

      - name: Create GitHub Release after final tag verification
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${RELEASE_VERSION}" --repo "${REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_VERSION}" \
              --repo "${REPOSITORY}" \
              --target "${MERGE_SHA}" \
              --title "HouseKeeper ${RELEASE_VERSION}" \
              --generate-notes \
              --notes "Deployed candidate source: ${SOURCE_SHA}\nValidation run: ${CANDIDATE_RUN_ID}\nProduction deployment completed before this tag was created."
