name: Request Codex review

on:
  pull_request_target:
    branches:
      - development
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    name: Request Codex description and review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create one idempotent Codex request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- housekeeper-codex-review-request -->';
            const descriptionMarker = '<!-- housekeeper-codex-description-request -->';
            const issue = context.issue;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: issue.owner, repo: issue.repo, issue_number: issue.number, per_page: 100 });

            const existing = comments.find(comment =>
              comment.body?.includes(marker) ||
              comment.body?.trim() === '@codex review');

            if (existing) {
              core.info(`Codex review request already exists in comment ${existing.id}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body: `${marker}\n${descriptionMarker}\n@codex review this pull request and generate its description.\n\nBefore or alongside the review, update the pull request body by replacing only the content between the housekeeper-codex-description start and end markers. Keep the summary factual and concise, preserve all author notes, and do not change source files, labels, approvals, or merge state. If pull-request body write-back is unavailable, return the generated description in your response for the author to paste.\n\nCodex findings remain evidence for human disposition; this workflow does not create an artificial pass status.`
            });
