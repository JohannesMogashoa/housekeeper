name: Request Codex review

on:
  pull_request_target:
    branches:
      - development
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    name: Request repository-aware Codex review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create one idempotent Codex review request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- housekeeper-codex-review-request -->';
            const issue = context.issue;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: issue.owner, repo: issue.repo, issue_number: issue.number, per_page: 100 });

            const existing = comments.find(comment =>
              comment.body?.includes(marker) ||
              comment.body?.trim() === '@codex review');

            if (existing) {
              core.info(`Codex review request already exists in comment ${existing.id}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body: `${marker}\n@codex review\n\nAutomated review request for the current pull request. Codex findings remain evidence for human disposition; this workflow does not create an artificial pass status.`
            });
