name: Continuous Integration

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
      - release/**
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housekeeper-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  development-pr:
    name: Development pull-request validation
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/validate-development-pr.yml

  full-validation:
    name: Full branch validation
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/validate.yml
