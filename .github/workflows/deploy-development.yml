name: Deploy shared development

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact release-branch commit produced by successful validation.
        required: true
        type: string
      candidate_run_id:
        description: Successful release-branch validation run containing the exact candidate artifact.
        required: true
        type: string
      release_version:
        description: Version represented by the candidate, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: shared-development
      source_sha: ${{ inputs.source_sha }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      release_version: ${{ inputs.release_version }}
    secrets: inherit
